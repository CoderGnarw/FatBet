<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FatBet</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>🎰 FatBet</h1>

  <!-- LOGIN -->
  <div id="login">

  <a href="/auth/discord">
  <button>Mit Discord einloggen</button>
</a>

</div>

  <!-- GAME -->
  <div id="game" class="hidden">

    <p>
      Spieler:
      <span id="player"></span>
    </p>

    <p>
      Coins:
      <span id="coins">1000</span>
    </p>

    <p>
      Freispiele:
      <span id="freeSpins">0</span>
    </p>

    <!-- SLOT MACHINE -->
    <div class="slot-container">

      <div class="slot-machine">
      <div id="slotGrid" class="slot-grid"></div>
      </div>

    </div>

    <label for="betSelect">Einsatz:</label>

<select id="betSelect" onchange="changeBet()">
  <option value="10">10 Coins</option>
  <option value="25">25 Coins</option>
  <option value="50" selected>50 Coins</option>
  <option value="100">100 Coins</option>
  <option value="250">250 Coins</option>
  <option value="500">500 Coins</option>
</select>

    <!-- SPIN BUTTON -->
    <button onclick="spin()">
    Spin (<span id="betText">50</span>)
    </button>

    <!-- RESULT -->
    <p id="result"></p>

    <!-- LOOTBOX -->
    <button onclick="openLootbox()">
      🎁 Lootbox öffnen (100)
    </button>

    <!-- DAILY BONUS -->
    <button onclick="dailyReward()">
      🎉 Daily Reward
    </button>

    <!-- LEADERBOARD -->
    <h2>🏆 Leaderboard</h2>

    <ul id="leaderboard"></ul>

  </div>

  <script src="js/script.js"></script>
  <script src="js/bonus.js"></script>
  <script src="js/loot.js"></script>

</body>

</html>
